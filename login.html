<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Movie Hub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top right,
                    #1d456d,
                    #0b1118 60%
                );

        }


        .login-box {

            width: 100%;

            max-width: 420px;

            padding: 40px;

            background: #141d27;

            border: 1px solid #354250;

            border-radius: 15px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.5);

        }


        .logo {

            text-align: center;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .logo span {

            color: #d4af37;

        }


        .login-title {

            text-align: center;

            color: #aab4bf;

            margin-bottom: 35px;

        }


        .input-group {

            margin-bottom: 20px;

        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: #d4af37;

            font-weight: bold;

            font-size: 14px;

        }


        .input-group input {

            width: 100%;

            padding: 14px;

            background: #0d141c;

            border: 1px solid #364452;

            border-radius: 7px;

            outline: none;

            color: white;

            font-size: 15px;

        }


        .input-group input:focus {

            border-color: #d4af37;

        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #d4af37;

            color: #101820;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;

        }


        .login-button:hover {

            background: #f0cf5c;

        }


        .login-error {

            text-align: center;

            color: #ff7070;

            margin-top: 15px;

            min-height: 20px;

        }


        .demo-text {

            text-align: center;

            color: #687582;

            font-size: 12px;

            margin-top: 25px;

        }

    </style>

</head>


<body>


    <div class="login-box">

        <div class="logo">
            🎬 Movie<span>Hub</span>
        </div>


        <p class="login-title">
            Login to your Movie Hub
        </p>


        <form id="loginForm">


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


            <p
                id="loginError"
                class="login-error">
            </p>

        </form>


        <p class="demo-text">
            Movie Hub Student Project
        </p>

    </div>


    <script>

        /*

            If already logged in,
            open Movie Hub directly.

        */

        if (
            localStorage.getItem(
                "movieHubLoggedIn"
            ) === "true"
        ) {

            window.location.href =
                "index.html";

        }


        const loginForm =
            document.getElementById(
                "loginForm"
            );


        const loginError =
            document.getElementById(
                "loginError"
            );


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value
                        .trim();


                if (
                    email === "" ||
                    password === ""
                ) {

                    loginError.textContent =
                        "Please enter email and password.";

                    return;

                }


                /*
                    Demo login.

                    This is only front-end
                    authentication for the project.
                */

                localStorage.setItem(
                    "movieHubLoggedIn",
                    "true"
                );


                localStorage.setItem(
                    "movieHubUser",
                    email
                );


                window.location.href =
                    "index.html";

            }
        );

    </script>

</body>

</html>
